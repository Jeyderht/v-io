<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>V-IO · Visuales de club</title>
  <meta name="description" content="Visuales premium para clubs, DJs y eventos. Suscripción mensual o anual y visuales a medida.">
  <meta property="og:title" content="V-IO · Visuales de club">
  <meta property="og:description" content="Visuales premium para clubs, DJs y eventos.">
  <meta property="og:image" content="img/hero-1.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>

  <!--
    Plantilla de toda la web. js/runtime.js la lee y la dibuja dentro de #app.
    {{nombre}}                → valor que devuelve renderVals() (js/component.js y js/app.js)
    <sc-if value="{{x}}">     → se muestra solo si x es verdadero
    <sc-for list="{{lista}}" as="item"> → se repite por cada elemento de la lista
    Los atributos hint-* no hacen nada en la web publicada.
  -->
  <template id="tpl">
  <div class="shell" style="position: relative; overflow: hidden; background: #000000; color: #F7F9FF; font-family: 'DM Sans', sans-serif; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; min-height: 100vh">

    <div aria-hidden="true" style="position: absolute; width: 900px; height: 900px; left: 50%; top: 200px; margin-left: -450px; border-radius: 50%; background: {{accent}}; filter: blur(160px); animation: breathe 9s ease-in-out infinite"></div>

    <!-- ===== MENÚ ===== -->
    <div class="dockwrap" style="position: fixed; left: 0; right: 0; bottom: calc(34px + env(safe-area-inset-bottom)); z-index: 50; padding: 0 16px; display: flex; justify-content: center; pointer-events: none">
      <nav class="dock" aria-label="Principal" style="pointer-events: auto; max-width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 7px; border-radius: 999px; background: #0A1A22B3; border: 0.5px solid #FFFFFF14; backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); box-shadow: inset 0 0.5px 0 #FFFFFF38">
        <button class="press" type="button" onClick="{{nav.home.pick}}" aria-label="Inicio" aria-current="{{nav.home.current}}" style="{{nav.home.style}}"><span style="{{nav.home.box}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8 10.2L12 3.6l8.2 6.6V19a1.8 1.8 0 01-1.8 1.8h-3.6v-5.6a1 1 0 00-1-1h-3.6a1 1 0 00-1 1v5.6H5.6A1.8 1.8 0 013.8 19z"/></svg></span><sc-if value="{{nav.home.on}}" hint-placeholder-val="{{true}}"><span class="navlabel">Inicio</span></sc-if></button>
        <button class="press" type="button" onClick="{{nav.visuales.pick}}" aria-label="Visuales" aria-current="{{nav.visuales.current}}" style="{{nav.visuales.style}}"><span style="{{nav.visuales.box}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></span><sc-if value="{{nav.visuales.on}}" hint-placeholder-val="{{false}}"><span class="navlabel">Visuales</span></sc-if></button>
        <button class="press" type="button" onClick="{{nav.planes.pick}}" aria-label="Planes" aria-current="{{nav.planes.current}}" style="{{nav.planes.style}}"><span style="{{nav.planes.box}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.4 5.5h15.2a1.9 1.9 0 011.9 1.9V9.6a2.4 2.4 0 000 4.8v2.2a1.9 1.9 0 01-1.9 1.9H4.4a1.9 1.9 0 01-1.9-1.9v-2.2a2.4 2.4 0 000-4.8V7.4a1.9 1.9 0 011.9-1.9z"/><path d="M15 6v12" stroke-dasharray="1.6 2.2"/></svg></span><sc-if value="{{nav.planes.on}}" hint-placeholder-val="{{false}}"><span class="navlabel">Planes</span></sc-if></button>
        <button class="press" type="button" onClick="{{nav.contacto.pick}}" aria-label="Contacto" aria-current="{{nav.contacto.current}}" style="{{nav.contacto.style}}"><span style="{{nav.contacto.box}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8c4.7 0 8.5 3.2 8.5 7.3s-3.8 7.3-8.5 7.3c-.9 0-1.8-.1-2.6-.3l-3.6 1.8c-.4.2-.9-.2-.7-.6l.9-2.7C4.4 15.3 3.5 13.3 3.5 11.1c0-4.1 3.8-7.3 8.5-7.3z"/></svg></span><sc-if value="{{nav.contacto.on}}" hint-placeholder-val="{{false}}"><span class="navlabel">Contacto</span></sc-if></button>
        <sc-if value="{{isAdminUser}}" hint-placeholder-val="{{false}}">
          <button class="press" type="button" onClick="{{nav.admin.pick}}" aria-label="Admin" aria-current="{{nav.admin.current}}" style="{{nav.admin.style}}"><span style="{{nav.admin.box}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7h9.2M17.3 7h3.2M3.5 17h3.2M11.3 17h9.2"/><circle cx="15" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/></svg></span><sc-if value="{{nav.admin.on}}" hint-placeholder-val="{{false}}"><span class="navlabel">Admin</span></sc-if></button>
        </sc-if>
      </nav>
    </div>

    <!-- ===== INICIO ===== -->
    <sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
      <main class="page" style="position: relative">
        <section class="herofull" style="position: relative; min-height: 520px; box-sizing: border-box; --hd: {{hero.hd}}; --hm: {{hero.hm}}">
          <div class="herostage" style="position: relative; width: 100%; height: 100%; overflow: hidden">
            <img class="hero-d" src="{{hero.d1}}" alt="" aria-hidden="true" referrerpolicy="no-referrer" style="{{hero.d1Style}}">
            <sc-if value="{{hero.hasD2}}"><img class="hero-d" src="{{hero.d2}}" alt="" aria-hidden="true" referrerpolicy="no-referrer" style="{{hero.d2Style}}"></sc-if>
            <img class="hero-m" src="{{hero.m1}}" alt="" aria-hidden="true" referrerpolicy="no-referrer" style="{{hero.m1Style}}">
            <sc-if value="{{hero.hasM2}}"><img class="hero-m" src="{{hero.m2}}" alt="" aria-hidden="true" referrerpolicy="no-referrer" style="{{hero.m2Style}}"></sc-if>
            <div aria-hidden="true" style="{{hero.dark}}"></div>
            <div style="position: absolute; top: 22px; left: 24px; right: 24px; z-index: 2; display: flex; justify-content: space-between; align-items: center">
              <span style="font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.02em; line-height: 1; color: #F7F9FF">V-IO</span>
              <div style="display: flex; gap: 8px; align-items: center">
                <button class="press" type="button" onClick="{{openLogin}}" aria-label="{{accountLabel}}" style="{{accountBtnStyle}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.8 20.2c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6"/></svg></button>
                <button class="press" type="button" onClick="{{openPro}}" style="min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 0.5px solid #FFFFFF1F; background: #FFFFFF1F; color: #FFFFFF; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px)">{{proLabel}}</button>
              </div>
            </div>
            <div class="herocontent" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 22px; padding: 24px 20px calc(160px + env(safe-area-inset-bottom)); text-align: center">
              <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0">V-IO · Visuales de club</h1>
              <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; animation: rise 1s .3s ease both">
                <button class="press" type="button" onClick="{{openPro}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 11px 22px; border: 0; cursor: pointer; border-radius: 999px; background: #F7F9FF; color: #000F15; font: inherit; font-size: 15px; font-weight: 700; ">PRO Access<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
                <button class="press" type="button" onClick="{{nav.visuales.pick}}" style="min-height: 46px; padding: 11px 22px; border-radius: 999px; background: #00000066; border: 0.5px solid #FFFFFF40; color: #FFFFFF; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 0.5px 0 #FFFFFF40">Ver visuales</button>
              </div>
            </div>
            <div class="playerbar" style="position: absolute; left: 50%; width: 140px; margin-left: -70px; display: flex; flex-direction: column; animation: rise 1s .45s ease both">
              <div aria-hidden="true" style="height: 4px; border-radius: 999px; background: #FFFFFF33; position: relative"><div style="position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: #FFFFFFCC; animation: prog 7s linear infinite"></div></div>
            </div>
          </div>
        </section>

        <div aria-hidden="true" style="position: relative; overflow: hidden; border-top: 0.5px solid #FFFFFF12; border-bottom: 0.5px solid #FFFFFF12; background: #FFFFFF08; padding: 22px 0; margin: 64px 0 96px">
          <div style="display: flex; width: max-content; gap: 48px; animation: marquee 28s linear infinite; font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: clamp(24px, 3.2vw, 40px); color: #F7F9FF; white-space: nowrap">
            <span>VJ loops</span><span style="color: {{accent}}">✦</span><span>LED walls</span><span style="color: {{accent}}">✦</span><span>4K</span><span style="color: {{accent}}">✦</span><span>Resolume ready</span><span style="color: {{accent}}">✦</span><span>Intros DJ</span><span style="color: {{accent}}">✦</span><span>Licencia eventos</span><span style="color: {{accent}}">✦</span>
            <span>VJ loops</span><span style="color: {{accent}}">✦</span><span>LED walls</span><span style="color: {{accent}}">✦</span><span>4K</span><span style="color: {{accent}}">✦</span><span>Resolume ready</span><span style="color: {{accent}}">✦</span><span>Intros DJ</span><span style="color: {{accent}}">✦</span><span>Licencia eventos</span><span style="color: {{accent}}">✦</span>
          </div>
        </div>

        <section style="position: relative; max-width: 1200px; margin: 0 auto; padding: 0 20px 96px">
          <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
            <li style="padding: 30px; border-radius: 32px; background: #FFFFFF0F; border: 0.5px solid #FFFFFF12; box-shadow: inset 0 0.5px 0 #FFFFFF26; display: flex; flex-direction: column; gap: 16px"><span style="width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #FFFFFF1A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F7F9FF" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 6h15A1.5 1.5 0 0121 7.5V10a2 2 0 000 4v2.5a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 16.5V14a2 2 0 000-4V7.5A1.5 1.5 0 014.5 6z"></path><path d="M14.5 6.5v11" stroke-dasharray="2 2.2"></path></svg></span><strong style="font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: 26px">Suscríbete</strong></li>
            <li style="padding: 30px; border-radius: 32px; background: #FFFFFF0F; border: 0.5px solid #FFFFFF12; box-shadow: inset 0 0.5px 0 #FFFFFF26; display: flex; flex-direction: column; gap: 16px"><span style="width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #FFFFFF1A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F7F9FF" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2.2"></rect><rect x="13" y="3" width="8" height="8" rx="2.2"></rect><rect x="3" y="13" width="8" height="8" rx="2.2"></rect><rect x="13" y="13" width="8" height="8" rx="2.2"></rect><path d="M16 15.6v2.8l2.4-1.4z" fill="#F7F9FF"></path></svg></span><strong style="font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: 26px">Descarga</strong></li>
            <li style="padding: 30px; border-radius: 32px; background: #FFFFFF0F; border: 0.5px solid #FFFFFF12; box-shadow: inset 0 0.5px 0 #FFFFFF26; display: flex; flex-direction: column; gap: 16px"><span style="width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #FFFFFF1A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F7F9FF" stroke-width="1.9" stroke-linecap="round"><rect x="2.5" y="8" width="19" height="10" rx="3"></rect><circle cx="15.5" cy="13" r="2.8"></circle><path d="M6 11.5h3M6 14.5h3M15.5 8V4.5M12 5l1.5 2M19 5l-1.5 2"></path></svg></span><strong style="font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: 26px">Proyecta</strong></li>
          </ol>
        </section>

        <!-- Inicio · visuales a medida -->
        <section style="position: relative; max-width: 1200px; margin: 0 auto; padding: 0 20px 96px">
          <div style="position: relative; overflow: hidden; border-radius: 40px; background: #FFFFFF0A; border: 0.5px solid #FFFFFF14; box-shadow: inset 0 0.5px 0 #FFFFFF26; padding: clamp(28px, 5vw, 56px); display: flex; flex-wrap: wrap; gap: 36px; align-items: center">
            <div aria-hidden="true" style="position: absolute; width: 520px; height: 520px; right: -160px; top: -200px; border-radius: 50%; background: #6F8AD5; opacity: 0.35; filter: blur(120px)"></div>
            <div style="position: relative; flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 18px; align-items: flex-start">
              <span style="font-size: 13px; font-weight: 700; color: #86D3D8">Servicio a medida</span>
              <h2 style="margin: 0; font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: clamp(32px, 5vw, 64px); line-height: 0.95; color: #F7F9FF">Visuales a medida</h2>
              <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #9DB0C2; max-width: 440px">Creamos visuales únicos para tu marca, artista o evento. Listos para proyectar.</p>
              <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center">
                <button class="press" type="button" onClick="{{openQuote}}" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 0; cursor: pointer; border-radius: 999px; background: #F7F9FF; color: #000F15; font: inherit; font-size: 15px; font-weight: 700">Cotizar mi visual<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
                <span style="font-size: 15px; color: #9DB0C2">Desde <strong style="color: #F7F9FF">{{customFrom}}</strong></span>
              </div>
            </div>
            <ul style="position: relative; flex: 1 1 380px; min-width: 0; margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
              <li style="padding: 20px; border-radius: 24px; background: #FFFFFF0F; border: 0.5px solid #FFFFFF12; display: flex; flex-direction: column; gap: 12px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#86D3D8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.2L20 9l-4 4 1 5.6L12 16l-5 2.6L8 13 4 9l5.6-.8z"></path></svg><strong style="font-size: 16px; font-weight: 600; line-height: 1.3">Logo animado e intros</strong></li>
              <li style="padding: 20px; border-radius: 24px; background: #FFFFFF0F; border: 0.5px solid #FFFFFF12; display: flex; flex-direction: column; gap: 12px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#86D3D8" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2.5"></rect><path d="M7 8h.01M10 8h.01M13 8h.01M16 8h.01M7 12h.01M10 12h.01M13 12h.01M16 12h.01M12 16v3.5M8 20h8"></path></svg><strong style="font-size: 16px; font-weight: 600; line-height: 1.3">LED de cualquier medida</strong></li>
              <li style="padding: 20px; border-radius: 24px; background: #FFFFFF0F; border: 0.5px solid #FFFFFF12; display: flex; flex-direction: column; gap: 12px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#86D3D8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><strong style="font-size: 16px; font-weight: 600; line-height: 1.3">Visuales para tu evento</strong></li>
              <li style="padding: 20px; border-radius: 24px; background: #FFFFFF0F; border: 0.5px solid #FFFFFF12; display: flex; flex-direction: column; gap: 12px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#86D3D8" stroke-width="1.9" stroke-linecap="round"><path d="M3 12v0M7 8.5v7M11 4.5v15M15 7.5v9M19 10v4"></path></svg><strong style="font-size: 16px; font-weight: 600; line-height: 1.3">Show sincronizado al set</strong></li>
            </ul>
          </div>
        </section>

        <section style="position: relative; max-width: 1200px; margin: 0 auto; padding: 0 20px 64px">
          <div style="padding: clamp(40px, 7vw, 88px) 24px; border-radius: 44px; background: #FFFFFF0F; border: 0.5px solid #FFFFFF14; box-shadow: inset 0 0.5px 0 #FFFFFF33; display: flex; flex-direction: column; gap: 32px; align-items: center; text-align: center; position: relative; overflow: hidden">
            <div aria-hidden="true" style="position: absolute; width: 560px; height: 560px; left: 50%; top: 50%; margin: -280px 0 0 -280px; border-radius: 50%; background: {{accent}}; filter: blur(100px); animation: breathe 6s ease-in-out infinite"></div>
            <h2 style="position: relative; margin: 0; font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: clamp(32px, 6vw, 84px); line-height: 0.95; color: #F7F9FF; max-width: 900px">Enciende la pantalla</h2>
            <button class="press" type="button" onClick="{{openPro}}" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: min(480px, 100%); min-height: 64px; padding: 20px; border: 0; cursor: pointer; border-radius: 999px; background: #F7F9FF; color: #000F15; font: inherit; font-size: 19px; font-weight: 700; ">PRO Access<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
          </div>
        </section>
      </main>
    </sc-if>

    <!-- ===== VISUALES ===== -->
    <sc-if value="{{isVisuales}}" hint-placeholder-val="{{false}}">
      <main class="page pagepad" style="position: relative; max-width: 1280px; margin: 0 auto; padding-left: 12px; padding-right: 12px; padding-bottom: 40px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 0 8px 8px">
          <h1 style="margin: 0; font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: clamp(36px, 7vw, 84px); line-height: 0.92; color: #F7F9FF">Visuales</h1>
          <button class="press" type="button" onClick="{{openLogin}}" style="{{memberPillStyle}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.8 20.2c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6"/></svg>{{memberPillLabel}}</button>
        </div>
        <label for="buscar-v" style="display: flex; align-items: center; gap: 10px; padding: 0 8px 0 18px; min-height: 52px; border-radius: 999px; background: #FFFFFF14; border: 0.5px solid #FFFFFF14; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: inset 0 0.5px 0 #FFFFFF26; cursor: text">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9DB0C2" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="M15.8 15.8l4.7 4.7"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar visuales</span>
          <input id="buscar-v" type="search" value="{{query}}" onChange="{{onQuery}}" placeholder="Buscar visuales" autocomplete="off" style="flex: 1; min-width: 0; height: 48px; border: 0; outline: none; background: transparent; color: #F7F9FF; font: inherit; font-size: 17px">
          <sc-if value="{{hasQuery}}" hint-placeholder-val="{{false}}">

        <h1 style="margin: 0; font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: clamp(36px, 7vw, 84px); line-height: 0.92; color: #F7F9FF">Contacto</h1>

          <span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: #000F15; color: #F7F9FF; display: inline-flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20.5l1.4-5.1A8 8 0 1121 12z"></path></svg></span>

          <span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF1A; color: #86D3D8; display: inline-flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.2L20 9l-4 4 1 5.6L12 16l-5 2.6L8 13 4 9l5.6-.8z"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><strong style="font-size: 19px; font-weight: 700">Cotizar visual a medida</strong><span style="font-size: 15px; color: #9DB0C2">Logos, intros, LED y shows · desde {{customFrom}}</span></span>

          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><strong style="font-size: 19px; font-weight: 700">{{accountCardTitle}}</strong><span style="font-size: 15px; color: #9DB0C2">{{accountCardSub}}</span></span>
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>

            <button class="flink" type="button" onClick="{{goTerminos}}">Términos</button>
            <button class="flink" type="button" onClick="{{goPrivacidad}}">Privacidad</button>
            <button class="flink" type="button" onClick="{{nav.admin.pick}}">Admin</button>
          </nav>
        </div>
        <div style="margin-top: 34px; display: flex; flex-direction: column; gap: 16px">
          <h2 class="fhead">Métodos de pago</h2>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <span class="fpay"><img src="img/pagos/visa-mono.svg" alt="Visa" style="width: 42px; height: auto"></span>
            <span class="fpay"><img src="img/pagos/yape-mono.svg" alt="Yape" style="height: 30px; width: auto"></span>
            <span class="fpay"><img src="img/pagos/plin-mono.svg" alt="Plin" style="height: 28px; width: auto"></span>
          </div>
        </div>
        <div style="margin: 30px 0 22px; height: 0.5px; background: #FFFFFF1F"></div>
        <p style="margin: 0 0 18px; font-size: 15px; color: #9DB0C2">© 2026 V-IO. Todos los derechos reservados.</p>
        <div style="display: flex; flex-wrap: nowrap; gap: 12px; align-items: center; justify-content: space-between">
          <span class="fsign">Diseñado por<span class="fbrand"><img src="img/rckt-isotipo.svg" alt="" width="18" height="18">Rckt Studio</span></span>
          <button class="press ftop" type="button" onClick="{{backTop}}"><span class="toplabel">Volver arriba</span><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #F7F9FF; color: #000F15; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></span></button>
        </div>
      </div>
    </footer>

    <!-- ===== PREVIEW (ventana de vista previa) ===== -->
    <sc-if value="{{previewOpen}}" hint-placeholder-val="{{false}}">
      <div onClick="{{closePreview}}" style="position: fixed; inset: 0; z-index: 80; background: #00000099; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn .25s ease both">
        <div role="dialog" aria-modal="true" aria-label="{{preview.title}}" onClick="{{stop}}" style="width: min(820px, 100%); border-radius: 40px; overflow: hidden; background: #000F15; border: 0.5px solid #FFFFFF14; animation: sheetUp .35s cubic-bezier(.2,.8,.2,1) both">
          <div style="{{preview.stage}}">
            <sc-if value="{{preview.isDemo}}" hint-placeholder-val="{{true}}">
              <div aria-hidden="true" style="{{preview.shapeA}}"></div>
              <div aria-hidden="true" style="{{preview.shapeB}}"></div>
              <div aria-hidden="true" style="position: absolute; inset: 0; background: #FFFFFF; animation: strobe 2.8s linear infinite"></div>
              <span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg); font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: clamp(28px, 6vw, 56px); color: #FFFFFF; opacity: 0.18; white-space: nowrap">V-IO</span>
            </sc-if>
            <sc-if value="{{preview.isDrive}}" hint-placeholder-val="{{false}}">
              <iframe src="{{preview.driveSrc}}" title="{{preview.title}}" allow="autoplay; fullscreen" allowfullscreen style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000000"></iframe>
            </sc-if>
            <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none">
              <span style="display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; color: #FFFFFF; padding: 7px 12px; border-radius: 999px; background: #00000059; border: 0.5px solid #FFFFFF1A"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #50BFED; animation: pulse 1s ease-in-out infinite"></span>Preview</span>
              <button class="press" type="button" onClick="{{closePreview}}" aria-label="Cerrar" style="pointer-events: auto; width: 44px; height: 44px; border-radius: 50%; border: 0.5px solid #FFFFFF1F; background: #00000059; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
            </div>
          </div>
          <div style="padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 24px; font-weight: 700">{{preview.title}}</span>
              <span style="font-size: 15px; color: #9DB0C2">{{preview.meta}}</span>
            </div>
            <sc-if value="{{preview.showUnlock}}" hint-placeholder-val="{{true}}">
              <button class="press" type="button" onClick="{{previewToPro}}" style="min-height: 56px; padding: 16px 28px; border: 0; cursor: pointer; border-radius: 999px; background: #F7F9FF; color: #000F15; font: inherit; font-size: 17px; font-weight: 700">Desbloquear 4K</button>
            </sc-if>
            <sc-if value="{{preview.canDownload}}" hint-placeholder-val="{{false}}">
              <a class="press" href="{{preview.src}}" download="{{preview.file}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 16px 28px; border-radius: 999px; background: #F7F9FF; color: #000F15; text-decoration: none; font-size: 17px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11.5M7.5 11L12 15.5 16.5 11"/><path d="M4 16.5v1.3A2.2 2.2 0 006.2 20h11.6a2.2 2.2 0 002.2-2.2v-1.3"/></svg>Descargar</a>
            </sc-if>
            <sc-if value="{{preview.canOpenDrive}}" hint-placeholder-val="{{false}}">
              <a class="press" href="{{preview.driveView}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 8px; min-height: 56px; box-sizing: border-box; padding: 16px 22px; border-radius: 999px; background: #FFFFFF14; border: 0.5px solid #FFFFFF1F; color: #F7F9FF; text-decoration: none; font-size: 16px; font-weight: 600">Abrir en Drive</a>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-if>

    <!-- ===== SUSCRIPCIÓN (hoja de pago) ===== -->
    <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
      <div onClick="{{closeSheet}}" style="position: fixed; inset: 0; z-index: 90; background: #00000080; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; padding: 12px; animation: fadeIn .2s ease both">
        <div role="dialog" aria-modal="true" aria-label="Suscripción" onClick="{{stop}}" style="width: min(520px, 100%); box-sizing: border-box; border-radius: 40px; padding: 10px 24px 26px; background: #0A1A22F2; border: 0.5px solid #FFFFFF14; backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 0.5px 0 #FFFFFF33; display: flex; flex-direction: column; gap: 18px; animation: sheetUp .35s cubic-bezier(.2,.8,.2,1) both">
          <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 999px; background: #FFFFFF40; align-self: center"></div>
          <div style="display: flex; gap: 16px; align-items: center">
            <span aria-hidden="true" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 50%; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 6h15A1.5 1.5 0 0121 7.5V10a2 2 0 000 4v2.5a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 16.5V14a2 2 0 000-4V7.5A1.5 1.5 0 014.5 6z"></path></svg></span>
            <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
              <span style="font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: 22px">{{sheet.name}}</span>
              <span style="font-size: 15px; color: #9DB0C2">{{sheet.price}} {{period}}</span>
            </div>
            <button class="press" type="button" onClick="{{closeSheet}}" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #FFFFFF1F; color: #F7F9FF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
          </div>
          <div role="group" aria-label="Periodo de facturación" style="display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: #FFFFFF0F; border: 0.5px solid #FFFFFF12">
            <button class="press" type="button" onClick="{{setMonthly}}" aria-pressed="{{monthlyPressed}}" style="{{monthlyStyleWide}}">Mensual</button>
            <button class="press" type="button" onClick="{{setAnnual}}" aria-pressed="{{annualPressed}}" style="{{annualStyleWide}}">Anual · 2 meses gratis</button>
          </div>
          <label for="correo" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #9DB0C2">Tu correo
            <input id="correo" type="email" value="{{email}}" onChange="{{onEmail}}" placeholder="tu@correo.com" autocomplete="email" style="min-height: 52px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; border: 0.5px solid #FFFFFF14; background: #FFFFFF0F; color: #F7F9FF; font: inherit; font-size: 16px; font-weight: 500">
          </label>
          <sc-if value="{{emailError}}" hint-placeholder-val="{{false}}">
            <span role="alert" style="font-size: 14px; color: #FF8A95; margin-top: -8px">Escribe un correo válido.</span>
          </sc-if>
          <a class="press" href="{{checkoutHref}}" target="_blank" rel="noopener" onClick="{{checkout}}" style="{{checkoutStyle}}">Continuar al pago<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
          <span style="font-size: 13px; color: #7F93A6; text-align: center">Pagas por WhatsApp (tarjeta, Yape o transferencia) y te enviamos tu código de acceso</span>
          <button class="press" type="button" onClick="{{sheetToLogin}}" style="align-self: center; min-height: 44px; padding: 8px 16px; border: 0; background: transparent; color: #F7F9FF; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px">¿Ya tienes código? Ingresar</button>
        </div>
      </div>
    </sc-if>

    <!-- ===== INGRESAR / MI CUENTA ===== -->
    <sc-if value="{{loginOpen}}" hint-placeholder-val="{{false}}">
      <div onClick="{{closeLogin}}" style="position: fixed; inset: 0; z-index: 95; background: #00000080; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; padding: 12px; animation: fadeIn .2s ease both">
        <div role="dialog" aria-modal="true" aria-label="{{loginTitle}}" onClick="{{stop}}" style="width: min(480px, 100%); box-sizing: border-box; border-radius: 40px; padding: 10px 24px 26px; background: #0A1A22F2; border: 0.5px solid #FFFFFF14; backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 0.5px 0 #FFFFFF33; display: flex; flex-direction: column; gap: 18px; animation: sheetUp .35s cubic-bezier(.2,.8,.2,1) both">
          <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 999px; background: #FFFFFF40; align-self: center"></div>
          <div style="display: flex; gap: 16px; align-items: center">
            <span aria-hidden="true" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 50%; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.8"/><path d="M4.8 20.2c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6"/></svg></span>
            <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
              <span style="font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: 22px">{{loginTitle}}</span>
              <span style="font-size: 15px; color: #9DB0C2">{{loginSub}}</span>
            </div>
            <button class="press" type="button" onClick="{{closeLogin}}" aria-label="Cerrar" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 0; background: #FFFFFF1F; color: #F7F9FF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
          </div>

          <sc-if value="{{isMember}}" hint-placeholder-val="{{false}}">
            <div style="padding: 18px 20px; border-radius: 24px; background: #FFFFFF0F; border: 0.5px solid #FFFFFF14; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px"><span style="color: #9DB0C2">Plan</span><strong>{{member.planName}}</strong></div>
              <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; border-top: 0.5px solid #FFFFFF12; padding-top: 10px"><span style="color: #9DB0C2">Activo hasta</span><strong>{{member.until}}</strong></div>
            </div>
            <button class="press" type="button" onClick="{{memberToVisuales}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 16px; border: 0; border-radius: 999px; cursor: pointer; font: inherit; font-size: 17px; font-weight: 700; background: #F7F9FF; color: #000F15; ">Ir a mis visuales</button>
            <button class="press" type="button" onClick="{{logout}}" style="min-height: 48px; padding: 12px; border-radius: 999px; border: 0.5px solid #FFFFFF14; background: #FFFFFF0F; color: #F7F9FF; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600">Cerrar sesión</button>
          </sc-if>

          <sc-if value="{{isAdminUser}}" hint-placeholder-val="{{false}}">
            <button class="press" type="button" onClick="{{openAdmin}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 12px; border-radius: 999px; border: 0.5px solid #FFFFFF1F; background: #FFFFFF14; color: #F7F9FF; cursor: pointer; font: inherit; font-size: 16px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7h9.2M17.3 7h3.2M3.5 17h3.2M11.3 17h9.2"/><circle cx="15" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/></svg>Panel de administración</button>
          </sc-if>
          <sc-if value="{{notMember}}" hint-placeholder-val="{{true}}">
            <label for="codigo" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #9DB0C2">Código de acceso
              <input id="codigo" type="text" value="{{code}}" onChange="{{onCode}}" onKeyDown="{{onCodeKey}}" placeholder="VIO-XXXX-XXXX" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" style="min-height: 56px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; border: 0.5px solid #FFFFFF14; background: #FFFFFF0F; color: #F7F9FF; font: inherit; font-size: 20px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">
            </label>
            <sc-if value="{{hasLoginErr}}" hint-placeholder-val="{{false}}">
              <span role="alert" style="font-size: 14px; color: #FF8A95; margin-top: -8px">{{loginErr}}</span>
            </sc-if>
            <button class="press" type="button" onClick="{{doLogin}}" style="{{loginBtnStyle}}">{{loginBtnLabel}}</button>
            <span style="font-size: 13px; color: #7F93A6; text-align: center">Tu código es personal: funciona en los dispositivos que incluye tu plan</span>
            <button class="press" type="button" onClick="{{loginToPlanes}}" style="align-self: center; min-height: 44px; padding: 8px 16px; border: 0; background: transparent; color: #F7F9FF; cursor: pointer; font: inherit; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px">¿No tienes código? Ver planes</button>
            <button class="press" type="button" onClick="{{openAdmin}}" style="align-self: center; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 0.5px solid #FFFFFF14; background: #FFFFFF0A; color: #9DB0C2; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7h9.2M17.3 7h3.2M3.5 17h3.2M11.3 17h9.2"/><circle cx="15" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/></svg>Ingresar como administrador</button>
          </sc-if>
        </div>
      </div>
    </sc-if>

    <!-- ===== COTIZACIÓN A MEDIDA ===== -->
    <sc-if value="{{quoteOpen}}" hint-placeholder-val="{{false}}">
      <div onClick="{{closeQuote}}" style="position: fixed; inset: 0; z-index: 90; background: #00000080; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; padding: 12px; animation: fadeIn .2s ease both">
        <div role="dialog" aria-modal="true" aria-label="Cotizar visual a medida" onClick="{{stop}}" style="width: min(560px, 100%); max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box; border-radius: 40px; padding: 10px 24px 26px; background: #0A1A22F2; border: 0.5px solid #FFFFFF14; backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 0.5px 0 #FFFFFF33; display: flex; flex-direction: column; gap: 16px; animation: sheetUp .35s cubic-bezier(.2,.8,.2,1) both">
          <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 999px; background: #FFFFFF40; align-self: center"></div>
          <div style="display: flex; gap: 16px; align-items: center; justify-content: space-between">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.04em; font-size: 22px">Visual a medida</span>
              <span style="font-size: 15px; color: #9DB0C2">Cuéntanos tu idea · desde {{customFrom}}</span>
            </div>
            <button class="press" type="button" onClick="{{closeQuote}}" aria-label="Cerrar" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 0; background: #FFFFFF1F; color: #F7F9FF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
          </div>
          <div role="group" aria-label="Tipo de visual" style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{quoteTypes}}" as="qt" hint-placeholder-count="4">
              <button class="press" type="button" onClick="{{qt.pick}}" aria-pressed="{{qt.pressed}}" style="{{qt.style}}">{{qt.label}}</button>
            </sc-for>
          </div>
          <label for="q-nombre" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #9DB0C2">Tu nombre o marca
            <input id="q-nombre" type="text" value="{{qName}}" onChange="{{onQName}}" placeholder="DJ, club o productora" autocomplete="name" style="min-height: 52px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; border: 0.5px solid #FFFFFF14; background: #FFFFFF0F; color: #F7F9FF; font: inherit; font-size: 16px">
          </label>
          <label for="q-fecha" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #9DB0C2">Fecha del evento
            <input id="q-fecha" type="date" value="{{qDate}}" onChange="{{onQDate}}" style="min-height: 52px; box-sizing: border-box; padding: 0 18px; border-radius: 18px; border: 0.5px solid #FFFFFF14; background: #FFFFFF0F; color: #F7F9FF; font: inherit; font-size: 16px; color-scheme: dark">
          </label>
          <label for="q-detalle" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #9DB0C2">Tu idea
            <textarea id="q-detalle" rows="3" value="{{qDetail}}" onChange="{{onQDetail}}" placeholder="Colores, estilo, medida de la pantalla, logo…" style="box-sizing: border-box; padding: 14px 18px; border-radius: 18px; border: 0.5px solid #FFFFFF14; background: #FFFFFF0F; color: #F7F9FF; font: inherit; font-size: 16px; resize: vertical"></textarea>
          </label>
          <a class="press" href="{{quoteHref}}" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; box-sizing: border-box; padding: 16px; border-radius: 999px; text-decoration: none; font-size: 17px; font-weight: 700; background: #F7F9FF; color: #000F15; "><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20.5l1.4-5.1A8 8 0 1121 12z"></path></svg>Enviar por WhatsApp</a>
          <span style="font-size: 13px; color: #7F93A6; text-align: center">Te respondemos con una propuesta y el precio final</span>
        </div>
      </div>
    </sc-if>

  </div>
  </template>

  <!-- El orden importa: cada archivo usa lo que define el anterior -->
  <script src="config.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/component.js"></script>
  <script src="js/app.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
